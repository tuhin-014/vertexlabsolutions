<title>Diction &amp; Nina — Controller</title>
<style>
/* Diction & Nina — the Controller.
   A controller is held, not read: everything is sized off the phone it is on
   rather than off a picture pretending to be one, and the two things a thumb
   reaches for live in the two bottom corners.

   Everything else here is crayon on cartridge paper, because the three of
   them drew it. Nothing is a rectangle — the corner radii are deliberately
   lopsided and unmatched, which is the trick that makes a CSS box read as a
   line somebody drew rather than a line a browser produced — and nothing
   sits quite straight. */
:root {
  --paper:#fdf3dc; --ink:#3a2a17;
  --red:#e23b2e; --orange:#f28a1c; --yellow:#ffd12e; --green:#3fbf3f;
  --cyan:#18cbe0; --blue:#3b6fe0; --purple:#9a4fd8; --pink:#f2199c;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%; color:var(--ink); overflow:hidden;
  font-family:"Comic Sans MS","Chalkboard SE","Segoe Print","Trebuchet MS",sans-serif;
  -webkit-user-select:none; user-select:none; touch-action:none;
  background-color:var(--paper);
  /* the tooth of the paper: two faint crossing washes, nothing you would
     notice and everything you would miss */
  background-image:
    repeating-linear-gradient(58deg, rgba(150,120,70,.05) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-31deg, rgba(150,120,70,.045) 0 2px, transparent 2px 9px);
}
.hidden { display:none !important; }

/* the crayon box: four corners that disagree with each other */
.drawn {
  border:3px solid var(--ink);
  border-radius:255px 14px 225px 16px / 16px 225px 14px 255px;
}

#pad-join {
  height:100%; display:flex; flex-direction:column; justify-content:center;
  gap:12px; padding:20px max(20px, env(safe-area-inset-left)) 20px max(20px, env(safe-area-inset-right));
  max-width:520px; margin:0 auto; text-align:center; overflow-y:auto;
}
#pad-draw { width:100%; max-width:420px; height:auto; margin:0 auto; display:block; }
#pad-join h1 { font-size:34px; letter-spacing:1px; transform:rotate(-1.4deg); }
#pad-join h1 span { display:inline-block; }
/* every letter a different crayon, and none of them upright, because a name
   written by three children taking turns is never written in one hand */
#pad-join h1 .c0 { color:var(--red);    transform:rotate(-6deg) translateY(1px); }
#pad-join h1 .c1 { color:var(--orange); transform:rotate(4deg); }
#pad-join h1 .c2 { color:var(--yellow); transform:rotate(-3deg) translateY(-2px);
  -webkit-text-stroke:.6px var(--ink); }
#pad-join h1 .c3 { color:var(--green);  transform:rotate(7deg); }
#pad-join h1 .c4 { color:var(--cyan);   transform:rotate(-5deg) translateY(2px); }
#pad-join h1 .c5 { color:var(--blue);   transform:rotate(3deg); }
#pad-join h1 .c6 { color:var(--purple); transform:rotate(-4deg); }
#pad-join h1 .c7 { color:var(--pink);   transform:rotate(6deg) translateY(-1px); }
#pad-join p { font-size:16px; line-height:1.5; }
#pad-join b { color:var(--purple); }
#pad-join .small { font-size:13px; opacity:.62; }
#pad-room {
  font-family:inherit; font-size:34px; font-weight:bold; letter-spacing:6px;
  text-align:center; text-transform:uppercase; padding:14px 10px;
  border:3px solid var(--ink);
  border-radius:255px 16px 225px 14px / 14px 225px 16px 255px;
  background:#fffdf6; color:var(--ink); width:100%; transform:rotate(.7deg);
  outline-color:var(--pink);
}
#pad-go {
  font-family:inherit; font-size:24px; font-weight:bold; padding:15px;
  border:3px solid var(--ink);
  border-radius:225px 16px 255px 14px / 14px 255px 16px 225px;
  background:var(--yellow); color:var(--ink); transform:rotate(-1deg);
}
#pad-go:active { background:var(--orange); transform:rotate(-1deg) scale(.97); }
#pad-msg { min-height:26px; font-size:15px; color:var(--red); }

#pad-face { position:fixed; inset:0; }
#pad-who {
  position:absolute; top:max(12px, env(safe-area-inset-top)); left:0; right:0;
  text-align:center; font-weight:bold; font-size:17px; color:var(--purple);
  transform:rotate(-.8deg);
}
/* Between the two thumbs is a tall stripe of nothing — a controller is all
   corners — so the one thing worth putting there goes there: whoever you are
   holding. It sits behind both thumbs and catches nothing. */
#pad-me {
  position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
  width:min(70vw, 340px); height:auto; pointer-events:none;
}
@media (max-height:560px) { #pad-me { display:none; } }

/* the stick is a ring somebody drew round twice, so it is not a circle */
#pad-stick {
  position:absolute; left:6%; bottom:9%;
  width:44vw; height:44vw; max-width:280px; max-height:280px;
  border:3px solid var(--ink); background:rgba(24,203,224,.13);
  border-radius:49% 51% 47% 53% / 53% 47% 51% 49%;
  transform:rotate(2deg);
}
#pad-nub {
  position:absolute; left:50%; top:50%; width:38%; height:38%;
  transform:translate(-50%,-50%); border-radius:52% 48% 51% 49% / 47% 53% 48% 52%;
  background:var(--cyan); border:3px solid var(--ink);
}
/* A column up the right-hand side, with the one you press most at the bottom
   where the thumb already is, and clear of the stick on the other side. */
#pad-btns {
  position:absolute; right:6%; bottom:9%;
  display:flex; flex-direction:column; gap:13px; align-items:center;
}
.pb {
  width:21vw; height:21vw; max-width:112px; max-height:112px;
  border:3px solid var(--ink); background:#fffdf6; color:var(--ink);
  border-radius:51% 49% 53% 47% / 48% 52% 49% 51%;
  font-size:7.5vw; font-family:inherit; line-height:1;
}
.pb[data-b="2"] { background:var(--pink);   transform:rotate(-4deg); }
.pb[data-b="1"] { background:var(--green);  transform:rotate(3deg); }
.pb:active { background:var(--yellow); }
.pb-big {
  width:26vw; height:26vw; max-width:140px; max-height:140px;
  background:var(--orange); font-size:9vw; transform:rotate(-2deg);
  border-radius:48% 52% 47% 53% / 52% 48% 53% 47%;
}
.pb-big:active { background:var(--yellow); transform:rotate(-2deg) scale(.96); }
#pad-small {
  position:absolute; top:max(46px, calc(env(safe-area-inset-top) + 38px));
  left:0; right:0; display:flex; gap:10px; justify-content:center;
}
.ps {
  width:58px; height:46px; border:3px solid var(--ink); color:var(--ink);
  border-radius:225px 14px 255px 16px / 16px 255px 14px 225px;
  background:#fffdf6; font-size:18px; font-family:inherit;
}
.ps:nth-child(1) { background:var(--cyan);   transform:rotate(-2deg); }
.ps:nth-child(2) { background:var(--blue);   transform:rotate(1.5deg); color:#fffdf6; }
.ps:nth-child(3) { background:var(--purple); transform:rotate(-1deg); color:#fffdf6; }
.ps:nth-child(4) { background:var(--red);    transform:rotate(2deg); color:#fffdf6; }
.ps:active { background:var(--yellow); color:var(--ink); }
@media (min-height:900px) and (min-width:600px) {
  .pb { font-size:44px; } .pb-big { font-size:54px; }
}
/* On a short screen the picture is the first thing to go — a controller you
   cannot reach the Connect button on is not a controller. */
@media (max-height:520px) { #pad-draw { display:none; } #pad-join h1 { font-size:26px; } }

</style>
<div id="pad-join">
  <canvas id="pad-draw" data-crayon="family" width="640" height="364"></canvas>
  <h1><span class="c0">C</span><span class="c1">o</span><span class="c2">n</span
    ><span class="c3">t</span><span class="c4">r</span><span class="c5">o</span
    ><span class="c6">l</span><span class="c7">l</span><span class="c0">e</span
    ><span class="c1">r</span></h1>
  <p>For <b>Diction &amp; Nina</b>, running on somebody's screen.
     Ask them to open <b>Menu &rarr; Play Online &rarr; Use a phone as a controller</b>,
     and type the code it shows you.</p>
  <input id="pad-room" maxlength="7" autocapitalize="characters" autocomplete="off"
    spellcheck="false" placeholder="ABC123">
  <button id="pad-go">Connect</button>
  <p id="pad-msg"></p>
  <p class="small">Nothing is stored and nothing goes through us — this talks
    straight to their game.</p>
</div>
<div id="pad-face" class="hidden">
  <div id="pad-who"></div>
  <canvas id="pad-me" width="420" height="366"></canvas>
  <div id="pad-stick"><div id="pad-nub"></div></div>
  <div id="pad-btns">
    <button class="pb" data-b="2">✨</button>
    <button class="pb" data-b="1">⚡</button>
    <button class="pb pb-big" data-b="0">💬</button>
  </div>
  <div id="pad-small">
    <button class="ps" data-b="12">▲</button>
    <button class="ps" data-b="13">▼</button>
    <button class="ps" data-b="9">☰</button>
    <button class="ps" id="pad-off">✕</button>
  </div>
</div>
<script>
/* ============================================================
   Diction & Nina — crayon
   ------------------------------------------------------------
   Two of this game's surfaces are not the game: the Controller a
   phone turns into, and the screen that asks you to hold your
   phone the other way round. Both of them started life plain,
   which is a strange thing to hand somebody who has just been
   playing a game about three children who draw on everything.

   So these two are drawn on rather than designed. Wax crayon on
   cartridge paper: every line gone over three times at falling
   opacity so the wax builds up where the hand pressed, nothing
   quite meeting at the corners, rings never closing, legs never
   the same length. All of it seeded rather than random — a
   drawing that shivered every frame would be a drawing nobody
   made.

   Both pages load this, and it wires itself up: any canvas with
   a data-crayon="..." gets the named picture drawn into it, so
   neither page has to remember to ask.
   ============================================================ */
(function (root) {
  'use strict';

  /* The tin. Kid drawings do not have a palette, they have whatever is left
     in the tin, so these are the eight loud ones and nothing in between. */
  const TIN = ['#e23b2e', '#f28a1c', '#ffd12e', '#3fbf3f',
    '#18cbe0', '#3b6fe0', '#9a4fd8', '#f2199c'];

  function rnd(seed) {
    let s = (seed * 1664525 + 1013904223) >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* One stroke, three times over: wide and faint underneath, narrow and
     darker on top. That is what wax does, and it is why a crayon line has
     a soft edge and a hard middle. */
  function line(ctx, pts, col, w, seed) {
    const r = rnd(seed);
    for (let pass = 2; pass >= 0; pass--) {
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.34 - pass * 0.08;
      ctx.lineWidth = w * (1 + pass * 0.55);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      pts.forEach(([x, y], i) => {
        const jx = (r() - 0.5) * 2, jy = (r() - 0.5) * 2;
        if (i) ctx.lineTo(x + jx, y + jy); else ctx.moveTo(x + jx, y + jy);
      });
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* A ring that does not close, because a hand going round twice never
     lands back where it started. */
  function ring(ctx, cx, cy, rad, col, w, seed) {
    const r = rnd(seed + 900);
    const from = r() * 6, turn = Math.PI * 2 * (0.97 + r() * 0.08);
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const a = from + i / 24 * turn;
      pts.push([cx + Math.cos(a) * rad * (0.97 + r() * 0.06),
        cy + Math.sin(a) * rad * (0.93 + r() * 0.08)]);
    }
    line(ctx, pts, col, w, seed);
  }

  /* Colouring in: back and forth, over the edges, never all the way into
     the corners. Nobody colours in neatly. */
  function fillIn(ctx, x, y, w, h, col, seed) {
    const r = rnd(seed);
    /* Wide enough apart that the paper shows between the strokes. Packed
       tight it stops being crayon and becomes paint, and a green filled in
       solid at this size goes dark and heavy rather than bright. */
    const step = 5 + r() * 2;
    const pts = [];
    for (let i = 0, yy = y; yy < y + h; i++, yy += step) {
      const l = x + (r() - 0.5) * 5, rt = x + w + (r() - 0.5) * 5;
      pts.push(i % 2 ? [rt, yy] : [l, yy]);
      pts.push(i % 2 ? [l, yy + step * 0.5] : [rt, yy + step * 0.5]);
    }
    line(ctx, pts, col, 3, seed + 5);
  }

  /* Colouring in a patch of something that is more than one colour — a cover
     that is green down one side and blue down the other. Kept inside its own
     half by a clip a little wider than the patch: over the line is what a
     child does, but green scribbled across blue is not two colours, it is
     one muddy one, and Diction's cover went dark grey. */
  function patch(ctx, x, y, w, h, col, seed) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x - 1.5, y - 1.5, w + 3, h + 3); ctx.clip();
    fillIn(ctx, x, y, w, h, col, seed);
    ctx.restore();
  }

  /* A rounded box, drawn as a path a hand could follow in one go. */
  function box(ctx, x, y, w, h, rad, col, wid, seed) {
    const pts = [];
    const corner = (cx, cy, a0) => {
      for (let i = 0; i <= 5; i++) {
        const a = a0 + i / 5 * Math.PI / 2;
        pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
      }
    };
    pts.push([x + rad, y]);
    pts.push([x + w - rad, y]); corner(x + w - rad, y + rad, -Math.PI / 2);
    pts.push([x + w, y + h - rad]); corner(x + w - rad, y + h - rad, 0);
    pts.push([x + rad, y + h]); corner(x + rad, y + h - rad, Math.PI / 2);
    pts.push([x, y + rad]); corner(x + rad, y + rad, Math.PI);
    line(ctx, pts, col, wid, seed);
  }

  /* A face: two eyes gone round twice, and a grin somebody was pleased with. */
  function faceOn(ctx, cx, cy, spread, col, seed, lashes) {
    ring(ctx, cx - spread, cy, 3.8, col, 1.15, seed);
    ring(ctx, cx + spread, cy, 3.8, col, 1.15, seed + 4);
    line(ctx, [[cx - spread, cy + 0.3], [cx - spread + 0.5, cy + 0.9]], col, 1.7, seed + 8);
    line(ctx, [[cx + spread, cy + 0.3], [cx + spread + 0.5, cy + 0.9]], col, 1.7, seed + 11);
    const grin = [];
    for (let i = 0; i <= 6; i++) {
      const t = -1 + i / 3;
      grin.push([cx + t * (spread + 1.4), cy + 5.5 + (1 - t * t) * 3.6]);
    }
    line(ctx, grin, col, 1.8, seed + 14);
    if (lashes) [-1, 1].forEach((sd, i) => {
      const ex = cx + sd * spread;
      line(ctx, [[ex + sd * 3.4, cy - 1.6], [ex + sd * 6.4, cy - 3.4]], col, 1.3, seed + 20 + i);
      line(ctx, [[ex + sd * 3.6, cy + 0.4], [ex + sd * 6.8, cy + 0.8]], col, 1.3, seed + 24 + i);
    });
  }

  /* A block of one colour with a hard edge, which is what a stripe on a cover
     looks like. The crayon goes over the line, but the line is where it stops
     being that stripe, so it is cut there: a soft crayon stroke is over twice
     as wide as its own nominal width, and a rainbow of six of them laid down
     without cutting is not a rainbow, it is a brown smudge with a halo. */
  function block(ctx, x, y, w, h, col, seed) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    const long = w >= h;
    const mid = long ? y + h / 2 : x + w / 2;
    line(ctx, long
      ? [[x - 2, mid], [x + w * 0.5, mid + 0.7], [x + w + 2, mid - 0.6]]
      : [[mid, y - 2], [mid + 0.7, y + h * 0.5], [mid - 0.6, y + h + 2]],
    col, (long ? h : w) * 1.15, seed);
    ctx.restore();
  }

  /* Bands of colour laid down the length of something, which is how a child
     colours in a striped thing: one stroke per stripe, straight across. */
  function bands(ctx, x, y, w, h, cols, seed) {
    const step = h / cols.length;
    cols.forEach((col, i) => block(ctx, x, y + step * i, w, step, col, seed + i * 3));
  }

  /* ---- the three of them ------------------------------------------------
     Not three stick people in three colours: these are Diction, Nina and
     Limey, who are books. Diction's head is his split cover, green down one
     side and blue down the other with the pages showing at the seam; Nina's
     is her notebook, pink with the yellow band across it and the stripes
     along the bottom; Limey is a pocket colouring book, rainbow all the way
     down, and shorter than both of them.

     Drawn feet-first from the ground up in the character's own space, so a
     scene only has to say where the ground is and how big they are. Arms are
     not drawn here — three people holding hands share two arms between each
     pair, and a shared arm belongs to the scene, not to either of them. */
  const INK = '#3a2a17';
  function who(ctx, kind, x, groundY, k, seed, tilt) {
    ctx.save();
    ctx.translate(x, groundY); ctx.rotate(tilt || 0); ctx.scale(k, k);
    /* Over the line is what a child does — but only just over. Everything
       that colours a cover in is kept to that cover with a shade over a
       pencil-width of slop, because a yellow band scribbled a full crayon's
       width past a head is not a band, it is a halo. */
    const inside = (bx, by, bw, bh, fn) => {
      ctx.save();
      ctx.beginPath(); ctx.rect(bx - 1.5, by - 1.5, bw + 3, bh + 3); ctx.clip();
      fn(); ctx.restore();
    };
    let shY = -60;
    if (kind === 'diction') {
      /* long legs, and a cover that cannot decide which colour it is */
      line(ctx, [[-4, -58], [-9, -2]], INK, 2.6, seed + 1);
      line(ctx, [[4, -58], [9, 0]], INK, 2.6, seed + 2);
      block(ctx, -10, -80, 11, 22, '#3fbf3f', seed + 5);
      block(ctx, 1, -80, 9, 22, '#2f8fe8', seed + 9);
      box(ctx, -10, -80, 20, 22, 3, INK, 2.2, seed + 13);
      line(ctx, [[-3, -84], [-3, -80]], INK, 1.8, seed + 15);
      line(ctx, [[3, -84], [3, -80]], INK, 1.8, seed + 16);
      /* His cover is the one thing about him: green down one side, blue down
         the other. Scribbled in loose the two ran together into one dark
         teal, so each half is laid down as its own block and stops where the
         pages are. */
      block(ctx, -15, -118, 16, 34, '#3fbf3f', seed + 17);
      block(ctx, 1, -118, 14, 34, '#2f8fe8', seed + 21);
      box(ctx, -15, -118, 30, 34, 4, INK, 2.6, seed + 25);
      // the pages, showing down the middle where the two covers meet
      line(ctx, [[0, -115], [-2, -108], [2, -101], [-1, -93], [1, -87]],
        '#fffdf6', 2, seed + 29);
      faceOn(ctx, 0, -100, 7, INK, seed + 33, false);
      shY = -74;
    } else if (kind === 'nina') {
      /* striped legs — one colour to the knee and another one down */
      [-5, 5].forEach((lx, i) => {
        line(ctx, [[lx, -50], [lx * 1.2, -26]], '#18cbe0', 3.4, seed + 1 + i);
        line(ctx, [[lx * 1.2, -26], [lx * 1.5, -2]], '#f2199c', 3.4, seed + 3 + i);
      });
      line(ctx, [[-7, -74], [7, -74], [12, -50], [-12, -50], [-7, -74]], INK, 2.2, seed + 6);
      line(ctx, [[-4, -66], [-3.4, -65.4]], '#ffe01a', 3, seed + 8);
      line(ctx, [[3, -60], [3.6, -59.4]], '#f2199c', 3, seed + 10);
      line(ctx, [[-3, -78], [-3, -74]], INK, 1.8, seed + 11);
      line(ctx, [[3, -78], [3, -74]], INK, 1.8, seed + 12);
      inside(-14, -110, 28, 32, () => {
        /* The pink cover shows above the band and nowhere else. Filled in
           behind the band as well it came out orange, which is what yellow
           crayon over pink crayon is, and an orange band is not her band. */
        fillIn(ctx, -14, -110, 28, 11, '#f2199c', seed + 13);
        bands(ctx, -14, -99, 28, 10, ['#ffe01a'], seed + 17);
        const cols = ['#f2199c', '#18cbe0', '#fffdf6', '#f2199c', '#18cbe0', '#f2199c'];
        for (let i = 0; i < 6; i++) block(ctx, -14 + i * 4.67, -89, 4.67, 11, cols[i], seed + 24 + i);
      });
      box(ctx, -14, -110, 28, 32, 4, INK, 2.6, seed + 33);
      faceOn(ctx, 0, -96, 7, INK, seed + 37, true);
      shY = -70;
    } else {
      /* the little one: rainbow all the way down, and red crayon for limbs */
      line(ctx, [[-4, -44], [-8, -1]], '#e0392f', 3, seed + 1);
      line(ctx, [[4, -44], [8, 0]], '#e0392f', 3, seed + 2);
      inside(-9, -60, 18, 16, () => bands(ctx, -9, -60, 18, 16, TIN.slice(0, 6), seed + 5));
      box(ctx, -9, -60, 18, 16, 3, INK, 2.2, seed + 11);
      line(ctx, [[-2.5, -64], [-2.5, -60]], INK, 1.8, seed + 13);
      line(ctx, [[2.5, -64], [2.5, -60]], INK, 1.8, seed + 14);
      inside(-13, -92, 26, 28, () => bands(ctx, -13, -92, 26, 28,
        ['#e0392f', '#f28a1c', '#f2d016', '#3fbf3f', '#2f8fe8', '#7a4fd0'], seed + 15));
      box(ctx, -13, -92, 26, 28, 4, INK, 2.6, seed + 23);
      faceOn(ctx, 0, -77, 6, INK, seed + 27, false);
      shY = -56;
    }
    ctx.restore();
    return { x, shY: groundY + shY * k, reach: 26 * k, col: kind === 'diction' ? '#3fbf3f'
      : kind === 'nina' ? '#f2199c' : '#e0392f' };
  }

  function sun(ctx, cx, cy, rad, seed) {
    ring(ctx, cx, cy, rad, '#ffd12e', 2.6, seed);
    const r = rnd(seed + 3);
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2 + r() * 0.2;
      line(ctx, [[cx + Math.cos(a) * (rad + 4), cy + Math.sin(a) * (rad + 4)],
        [cx + Math.cos(a) * (rad + 11), cy + Math.sin(a) * (rad + 11)]],
      '#f28a1c', 2.2, seed + 10 + i);
    }
  }

  function heart(ctx, hx, hy, k, col, seed) {
    const pts = [];
    for (let i = 0; i <= 26; i++) {
      const a = i / 26 * Math.PI * 2;
      pts.push([hx + 16 * Math.pow(Math.sin(a), 3) * k,
        hy - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a)
          - Math.cos(4 * a)) * k]);
    }
    line(ctx, pts, col, 2.2, seed);
  }

  function flower(ctx, x, groundY, col, seed) {
    const r = rnd(seed);
    const h = 14 + r() * 10, cy = groundY - h;
    line(ctx, [[x, groundY], [x + (r() - 0.5) * 3, cy + 3]], '#3fbf3f', 2, seed + 1);
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      ring(ctx, x + Math.cos(a) * 4, cy + Math.sin(a) * 4, 3, col, 1.8, seed + 4 + i);
    }
    ring(ctx, x, cy, 2, '#ffd12e', 1.8, seed + 20);
  }

  function rainbow(ctx, cx, cy, rad, seed) {
    /* The bands step in by a share of the arc rather than by a fixed number
       of units, so a small rainbow is a small rainbow and not five bands and
       a blot where the inside one turned inside out. */
    for (let b = 0; b < 6; b++) {
      const rr = rad * (1 - b * 0.13), pts = [];
      for (let i = 0; i <= 16; i++) {
        const a = Math.PI + i / 16 * Math.PI;
        pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.85]);
      }
      line(ctx, pts, TIN[b], 3, seed + b * 7);
    }
  }

  /* Set a canvas up in a made-up coordinate space and centre the picture in
     whatever the page has actually given it. */
  function stage(cv, vw, vh) {
    if (!cv || !cv.getContext) return null;
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cv.width, cv.height);
    const sc = Math.min(cv.width / vw, cv.height / vh);
    c.translate((cv.width - vw * sc) / 2, (cv.height - vh * sc) / 2);
    c.scale(sc, sc);
    return c;
  }

  /* ---- the pictures ---------------------------------------------------- */

  /* The three of them holding hands, under a sun and a rainbow, which is the
     picture behind the fountain and also the picture every child draws. */
  function family(cv) {
    const c = stage(cv, 320, 182);
    if (!c) return;
    const GY = 152;
    rainbow(c, 36, 104, 32, 101);
    sun(c, 292, 30, 14, 201);
    const g = [];
    for (let i = 0; i <= 14; i++) g.push([8 + i * 22, GY + Math.sin(i * 1.3) * 2]);
    line(c, g, '#8a6a3a', 3, 41);
    for (let i = 0; i < 10; i++) {
      const gx = 14 + i * 33;
      line(c, [[gx, GY], [gx - 3, GY - 8]], '#3fbf3f', 1.8, 300 + i);
      line(c, [[gx + 2, GY], [gx + 4, GY - 9]], '#3fbf3f', 1.8, 320 + i);
    }
    flower(c, 26, GY, '#f2199c', 401);
    flower(c, 300, GY, '#9a4fd8', 419);
    flower(c, 272, GY, '#e23b2e', 433);
    const d = who(c, 'diction', 92, GY, 1, 11, -0.04);
    const n = who(c, 'nina', 160, GY, 1, 23, 0.03);
    const l = who(c, 'limey', 228, GY, 1, 37, -0.03);
    /* Two arms to a pair of hands, one line each, drooping the way an arm
       does when the person on the other end of it is shorter than you. */
    const hold = (a, b, col, seed) => {
      const mx = (a.x + b.x) / 2, my = Math.max(a.shY, b.shY) + 20;
      line(c, [[a.x + 11, a.shY], [mx, my], [b.x - 11, b.shY]], col, 2.6, seed);
    };
    hold(d, n, '#3fbf3f', 51);
    hold(n, l, '#f2199c', 53);
    line(c, [[d.x - 11, d.shY], [d.x - 24, d.shY + 14], [d.x - 27, d.shY + 22]], '#2f8fe8', 2.6, 55);
    line(c, [[l.x + 9, l.shY], [l.x + 20, l.shY + 12], [l.x + 24, l.shY + 20]], '#e0392f', 2.8, 57);
    heart(c, 124, 52, 0.42, '#18cbe0', 71);
    heart(c, 196, 40, 0.34, '#e23b2e', 77);
    heart(c, 254, 62, 0.28, '#9a4fd8', 83);
  }

  /* A phone being turned, drawn by somebody who has seen a phone. */
  function phone(cv) {
    const c = stage(cv, 170, 216);
    if (!c) return;
    box(c, 56, 36, 78, 156, 12, '#9a4fd8', 3.4, 11);
    fillIn(c, 64, 52, 62, 124, '#18cbe0', 61);
    box(c, 63, 50, 64, 128, 5, '#3b6fe0', 2.2, 23);
    line(c, [[86, 184], [104, 184]], '#9a4fd8', 2.4, 31);
    /* Diction is on the screen, obviously, because it is his game */
    who(c, 'diction', 95, 166, 0.62, 47, 0.03);
    sun(c, 116, 66, 8, 55);
    heart(c, 76, 68, 0.28, '#e23b2e', 67);
    /* and an arrow swung right round the outside, saying: this way */
    const a = [];
    for (let i = 0; i <= 16; i++) {
      const t = Math.PI * 1.1 + i / 16 * Math.PI * 0.74;
      a.push([90 + Math.cos(t) * 76, 122 + Math.sin(t) * 96]);
    }
    line(c, a, '#3fbf3f', 3.4, 73);
    const tip = a[a.length - 1], prev = a[a.length - 3];
    const ang = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]);
    line(c, [[tip[0] - Math.cos(ang - 0.5) * 13, tip[1] - Math.sin(ang - 0.5) * 13],
      tip,
      [tip[0] - Math.cos(ang + 0.6) * 13, tip[1] - Math.sin(ang + 0.6) * 13]],
    '#3fbf3f', 3.4, 79);
  }

  const PICTURES = { family, phone };

  function draw(cv) {
    const p = cv && PICTURES[cv.getAttribute('data-crayon')];
    if (p) p(cv);
  }
  function drawAll(root2) {
    const scope = root2 || document;
    Array.prototype.forEach.call(scope.querySelectorAll('canvas[data-crayon]'), draw);
  }

  root.Crayon = { TIN, INK, line, ring, box, fillIn, patch, block, bands, faceOn, who, sun,
    heart, flower, rainbow, family, phone, draw, drawAll };

  /* Wire itself up. The pages load this after their own markup, so there is
     nothing to wait for; the load handler is only for a page that loads it
     early on purpose. */
  if (typeof document !== 'undefined') {
    drawAll();
    window.addEventListener('load', () => drawAll());
  }
})(typeof window !== 'undefined' ? window : this);

<script>
/* ============================================================
   Diction & Nina — playing together over the internet
   ------------------------------------------------------------
   There is no game server behind this. Two browsers talk straight
   to each other over a WebRTC data channel, and the only thing
   that has to travel by hand is a short invite code:

     Host  → makes an INVITE code, sends it to a friend
     Guest → pastes it, gets back a REPLY code
     Host  → pastes the reply, and the link is live

   The code is just the handshake — who to call, and how to prove it's
   really you — packed into about ninety bytes, so it's short enough to
   paste into any chat app. Nothing about the two players has to be on
   the same network, though a very locked-down router can still refuse
   the direct connection.
   ============================================================ */

const Net = (() => {
  const N = {
    role: null,          // 'host' | 'guest' | null
    state: 'idle',       // idle | offering | answering | waiting | open | closed | failed
    error: null,
    onOpen: null, onClose: null, onMessage: null, onState: null,
  };

  /* STUN hands each side its own outside address so the two can find each
     other across routers. Some routers — office and school networks, and the
     stricter kind of home one — refuse a direct link even then; for those the
     open relay is a last resort that forwards the packets. Slower, but the
     difference between playing and not playing when your friend is far away. */
  const STUN = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302',
                         'stun:stun.cloudflare.com:3478'] }];
  /* A relay is the one piece a single HTML file cannot be for itself: it has to
     be a machine sitting on the open internet. One is built in, so a strict
     router does not stop two friends playing and nobody has to sign up for
     anything first.

     Three addresses for the same relay, because which one gets out depends on
     what the network allows: 80 for the plainest case, 443 because a firewall
     that blocks everything else usually still lets 443 through, and 443 over
     TCP for the strictest of all, where UDP is refused outright and the relay
     has to look like ordinary web traffic.

     It is a free open relay, so it can be busy, rate-limited, or gone — which
     is exactly why a player's own can still be added, and always wins. */
  const RELAY_USER = 'openrelayproject', RELAY_PASS = 'openrelayproject';
  const BUILTIN_RELAY = [
    // the name the free relay has answered to for years
    { urls: 'turn:openrelay.metered.ca:80', username: RELAY_USER, credential: RELAY_PASS },
    { urls: 'turn:openrelay.metered.ca:443', username: RELAY_USER, credential: RELAY_PASS },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: RELAY_USER, credential: RELAY_PASS },
    /* and the name the same machines answer to now. A free relay that has been
       renamed, rate-limited or retired is the single most likely reason two
       friends a long way apart cannot reach each other, so it is worth asking
       for it by both names rather than betting the whole connection on one. */
    { urls: 'turn:standard.relay.metered.ca:80', username: RELAY_USER, credential: RELAY_PASS },
    { urls: 'turn:standard.relay.metered.ca:443', username: RELAY_USER, credential: RELAY_PASS },
    { urls: 'turns:standard.relay.metered.ca:443?transport=tcp', username: RELAY_USER, credential: RELAY_PASS },
  ];

  N.relayKind = function () { return N.getRelay() ? 'own' : 'built-in'; };
  N.relayCount = function () { const r = N.getRelay(); return r ? r.length : BUILTIN_RELAY.length; };
  N.builtInRelay = function () { return BUILTIN_RELAY.slice(); };
  /* Free open relays come and go, so a player's own can be added here without
     touching the game — it is remembered on this machine only, and it replaces
     the built-in one rather than joining it, so a relay that has gone bad
     cannot go on being tried. */
  N.getRelay = function () {
    let r = null;
    try { r = JSON.parse(localStorage.getItem('dn-turn') || 'null'); } catch (e) { return null; }
    if (!r) return null;
    const list = (Array.isArray(r) ? r : [r]).filter(x => x && x.urls);
    return list.length ? list : null;
  };
  N.setRelay = function (r) {
    try {
      const list = (Array.isArray(r) ? r : r ? [r] : []).filter(x => x && x.urls);
      if (list.length) localStorage.setItem('dn-turn', JSON.stringify(list));
      else localStorage.removeItem('dn-turn');
    } catch (e) {}
    return N.getRelay();
  };

     some give you a block of JavaScript with an array of servers in it, some
     give you the array on its own. All of them are accepted here, because
     "paste what they gave you" is the only instruction anybody should have to
     follow. */
  N.parseRelay = function (text) {
    const t = String(text || '').trim();
    if (!t) return null;
    let raw = null;
    // the array out of a block of JavaScript, if that is what was pasted
    const m = t.match(/\[[\s\S]*\]/);
    const tries = [t, m && m[0]].filter(Boolean);
    for (const cand of tries) {
      try { raw = JSON.parse(cand); break; } catch (e) { /* keep trying */ }

  N.testRelay = function (servers) {

     handshake to allocate a relay address can take several round trips. Six

  const GATHER_MS = 14000;

  let pc = null, chan = null;

  /* Some sandboxed viewers (the claude.ai artifact preview among them) switch
     browser-to-browser connections off entirely. Check before offering it,
     rather than blowing up when the player presses Host. */
  N.available = () => typeof RTCPeerConnection === 'function';
  N.unavailableReason =
    "This preview window doesn't allow browser-to-browser connections. " +
    'Save the game file and open it in your browser — or put it on a web page — ' +
    'and Play Online will work from there.';

  function setState(s, err) {
    N.state = s; N.error = err || null;
    if (N.onState) N.onState(s, N.error);
  }

  /* ---- codes ---------------------------------------------------------- */
  /* base64 with '.' and '_' standing in for '+' and '/', so the dashes that
     break the code into readable groups can never be mistaken for data */
  const b64url = {
    to: (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '.').replace(/\//g, '_').replace(/=+$/, ''),
    from: (str) => {
      const s = String(str).replace(/\./g, '+').replace(/_/g, '/').replace(/[^A-Za-z0-9+/]/g, '');
      const bin = atob(s + '==='.slice((s.length + 3) % 4));
      return Uint8Array.from(bin, (c) => c.charCodeAt(0));
    },
  };

  /* A second spelling of the very same code, for when it has to be read out
     over a call instead of pasted. All capitals, and the letters that sound or
     look like digits (I, L, O, U) are simply not in the alphabet — so "oh" is
     always zero and there is no such thing as a wrong guess between 1 and l. */
  const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  const b32 = {
    to: (bytes) => {
      let bits = 0, val = 0, out = '';
      for (const n of bytes) {
        val = ((val << 8) | n) & 0xFFFFF;   // keep only the bits still owed
        bits += 8;
        while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; }
      }
      if (bits) out += B32[(val << (5 - bits)) & 31];
      return out;
    },
    from: (str) => {
      // Q, V and the rest are real symbols; only O, I, L and U are stand-ins
      const clean = String(str).toUpperCase()
        .replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V')
        .replace(/[^0-9A-Z]/g, '');

      const out = [];
      for (const ch of clean) {
        const i = B32.indexOf(ch);
        if (i < 0) continue;
        val = ((val << 5) | i) & 0xFFFFF;
        bits += 5;

      return Uint8Array.from(out);

  };

  // the pasted spelling, so the decoder tries both and keeps what parses
  const looksB64 = (code) => /[a-z._]/.test(String(code).replace(/-/g, ''));
  /* Only four things out of the whole SDP actually matter for a data channel:
     who you are (ufrag/pwd), the certificate fingerprint, which side starts
     the handshake, and the addresses to try. Everything else is boilerplate
     both ends can rebuild identically — and the parts that do matter go out
     as raw bytes rather than text, which is what keeps the code short.

     A candidate line like
       candidate:2175273339 1 udp 2113937151 1ae886ca-….local 45149 typ host …
     is 135 characters of which only the address, the port and the word "host"
     carry any information: 19 bytes. */

  const ADDR_V4 = 0, ADDR_V6 = 1, ADDR_MDNS = 2;
  const CTYPES = ['host', 'srflx', 'prflx', 'relay'];
  const CPRIO = [2113937151, 1677729535, 1677729535, 41885439];
  const SETUPS = ['actpass', 'active', 'passive'];

  const hexBytes = (hex) => Uint8Array.from(hex.match(/../g) || [], (h) => parseInt(h, 16));
  const bytesHex = (b) => Array.from(b, (n) => n.toString(16).padStart(2, '0')).join('');

  function packAddr(addr) {
    if (/\.local$/i.test(addr)) {
      const hex = addr.replace(/\.local$/i, '').replace(/-/g, '');
      if (hex.length === 32) return { kind: ADDR_MDNS, bytes: hexBytes(hex) };
      return null;
    }
    const v4 = addr.split('.');
    if (v4.length === 4 && v4.every((n) => /^\d{1,3}$/.test(n) && +n < 256)) {
      return { kind: ADDR_V4, bytes: Uint8Array.from(v4, Number) };
    }
    if (addr.indexOf(':') !== -1) {
      // expand the :: shorthand, then take eight 16-bit groups
      const [head, tail] = addr.split('::');
      const h = head ? head.split(':') : [], t = tail ? tail.split(':') : [];
      const groups = h.concat(new Array(8 - h.length - t.length).fill('0'), t);
      if (groups.length !== 8) return null;
      const out = new Uint8Array(16);
      groups.forEach((g, i) => { const v = parseInt(g || '0', 16); out[i * 2] = v >> 8; out[i * 2 + 1] = v & 255; });
      return { kind: ADDR_V6, bytes: out };
    }
    return null;
  }
  function unpackAddr(kind, bytes) {
    if (kind === ADDR_V4) return Array.from(bytes).join('.');
    if (kind === ADDR_MDNS) {
      const h = bytesHex(bytes);
      return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}.local`;
    }
    const parts = [];
    for (let i = 0; i < 16; i += 2) parts.push(((bytes[i] << 8) | bytes[i + 1]).toString(16));
    return parts.join(':');
  }

  /* Keep only the addresses that can actually reach a friend. The public one
     comes first; a local one is worth carrying too, so two machines on the same
     wifi still find each other. But a .local name costs sixteen bytes and means
     nothing outside your own house, so it is dropped the moment there is a
     public address to use instead — that alone is a fifth of the whole code. */
  function pickCands(lines) {
    const parsed = [];
    for (const line of lines) {
      const m = line.match(/^candidate:\S+ \d+ (?:udp|UDP) \d+ (\S+) (\d+) typ (\w+)/);
      if (!m) continue;
      const type = CTYPES.indexOf(m[3]);
      const addr = packAddr(m[1]);
      if (type < 0 || !addr) continue;
      parsed.push({ type, addr, port: +m[2], key: m[1] + ':' + m[2] });
    }
    const public_ = parsed.some((c) => c.type !== 0);
    const keep = parsed.filter((c) => !(public_ && c.addr.kind === ADDR_MDNS));
    keep.sort((a, b) => (a.type === 0 ? 1 : 0) - (b.type === 0 ? 1 : 0));
    const seen = new Set(), out = [];
    for (const c of keep) {
      if (seen.has(c.key)) continue;
      seen.add(c.key);
      out.push(c);
      if (out.length >= 3) break;
    }
    return out;
  }

  function packSdp(sdp, lines) {
    const grab = (re) => { const m = sdp.match(re); return m ? m[1] : ''; };
    const ufrag = grab(/a=ice-ufrag:(\S+)/), pwd = grab(/a=ice-pwd:(\S+)/);
    const fp = hexBytes(grab(/a=fingerprint:sha-256 (\S+)/).replace(/:/g, '').toLowerCase());
    const setup = Math.max(0, SETUPS.indexOf(grab(/a=setup:(\S+)/)));
    const cands = pickCands(lines);
    const bytes = [setup, ufrag.length];
    for (const ch of ufrag) bytes.push(ch.charCodeAt(0));
    bytes.push(pwd.length);
    for (const ch of pwd) bytes.push(ch.charCodeAt(0));
    for (const n of fp) bytes.push(n);
    bytes.push(cands.length);
    for (const c of cands) {
      bytes.push(c.addr.kind | (c.type << 2));
      for (const n of c.addr.bytes) bytes.push(n);
      bytes.push(c.port >> 8, c.port & 255);
    }
    return Uint8Array.from(bytes);
  }
  function unpackSdp(b, type) {
    let at = 0;
    const setup = SETUPS[b[at++]] || (type === 'offer' ? 'actpass' : 'active');
    const take = (n) => { const s2 = String.fromCharCode(...b.slice(at, at + n)); at += n; return s2; };
    const ufrag = take(b[at++]);
    const pwd = take(b[at++]);
    const fp = (bytesHex(b.slice(at, at + 32)).match(/../g) || []).join(':').toUpperCase();
    at += 32;

      const len = kind === ADDR_V4 ? 4 : 16;

      at += 2;
      cands.push(`candidate:${i + 1} 1 udp ${CPRIO[ctype]} ${addr} ${port} typ ${CTYPES[ctype]}` +
        (ctype === 0 ? '' : ' raddr 0.0.0.0 rport 0'));
    }
    const sdp = [
      'v=0', 'o=- 1 1 IN IP4 127.0.0.1', 's=-', 't=0 0',
      'a=group:BUNDLE 0', 'a=msid-semantic: WMS',
      'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
      'c=IN IP4 0.0.0.0',
      'a=ice-ufrag:' + ufrag, 'a=ice-pwd:' + pwd,
      'a=fingerprint:sha-256 ' + fp, 'a=setup:' + setup,
      'a=mid:0', 'a=sctp-port:5000', 'a=max-message-size:262144', '',
    ].join('\r\n');
    return { sdp, cands };
  }
  function group(str, n, sep) { return (str.match(new RegExp('.{1,' + n + '}', 'g')) || []).join(sep); }
  function encode(kind, sdp, lines) {
    const body = packSdp(sdp, lines);
    const all = new Uint8Array(1 + body.length);
    all[0] = kind === 'offer' ? 1 : 2;
    all.set(body, 1);
    // grouped so a chat app wraps it at tidy places — nobody ever retypes it
    return group(b64url.to(all), 8, '-');
  }
  /* the same code again, spelled to be read out loud in fours */
  N.spoken = function (code) {
    const bytes = looksB64(code) ? b64url.from(code) : b32.from(code);
    return group(b32.to(bytes), 4, ' ');
  };
  function tryDecode(all) {
    if (!all || all.length < 40) return null;
    const kind = all[0] === 1 ? 'offer' : all[0] === 2 ? 'answer' : null;
    if (!kind) return null;
    const body = all.slice(1);
    // both names are short and must be plain SDP-legal text; anything else
    // means we read the code with the wrong alphabet
    const uLen = body[1], pLen = body[2 + uLen];
    if (!uLen || uLen > 64 || !pLen || pLen > 128) return null;
    if (body.length < 2 + uLen + 1 + pLen + 32) return null;
    let out;
    try { out = unpackSdp(body, kind); } catch (e) { return null; }
    if (!/a=ice-ufrag:[A-Za-z0-9+/]+\r/.test(out.sdp)) return null;
    if (!/a=ice-pwd:[A-Za-z0-9+/]+\r/.test(out.sdp)) return null;
    return { kind, sdp: out.sdp, cands: out.cands };
  }
  function decode(code) {
    const raw = String(code || '').trim();
    if (!raw) throw new Error('paste the code in first');
    const spellings = looksB64(raw) ? [b64url, b32] : [b32, b64url];
    for (const sp of spellings) {
      let bytes = null;
      try { bytes = sp.from(raw); } catch (e) { continue; }
      const got = tryDecode(bytes);
      if (got) return got;
    }
    throw new Error("that doesn't look like a whole code — check nothing got cut off");
  }

  /* ---- what does this network actually allow? ----------------------------
     Three separate things have to work, and when they don't the game just
     seems to hang. This finds out which one is missing, in plain words. */
  N.checkNetwork = async function () {
    const out = { stun: false, turn: false, signal: false, types: [], detail: '' };
    if (!N.available()) { out.detail = 'this window blocks browser-to-browser connections'; return out; }
    // 1 & 2: ask the address servers who we are, and whether a relay answers
    await new Promise((done) => {
      let probe;
      try { probe = new RTCPeerConnection({ iceServers: iceServers() }); } catch (e) { done(); return; }
      probe.createDataChannel('probe');
      const stop = () => { try { probe.close(); } catch (e) {} done(); };
      probe.onicecandidate = (e) => {
        if (!e.candidate) return stop();
        const t = (e.candidate.candidate.match(/ typ (\w+)/) || [])[1];
        if (t && out.types.indexOf(t) === -1) out.types.push(t);
        if (t === 'srflx') out.stun = true;
        if (t === 'relay') out.turn = true;
      };
      probe.createOffer().then((o) => probe.setLocalDescription(o)).catch(stop);
      setTimeout(stop, GATHER_MS);
    });
    // 3: can we reach a meeting point at all?
    try {
      const ws = await signalOpen('DNTEST' + makeRoomCode() + makeRoomCode(), () => {});
      out.signal = true;
      signalClose();
    } catch (e) { out.signal = false; }
    return out;
  };

  /* a short plain-English report the player can send on when asking for help */
  N.report = function (check) {
    const lines = [
      'Diction & Nina — connection check',
      'meeting point: ' + (check.signal ? 'reachable' : 'NOT reachable'),
      'own outside address (STUN): ' + (check.stun ? 'found' : 'NOT found'),
      'relay (TURN): ' + (check.turn ? 'available' : 'NOT available') +
        (N.getRelay() ? ' (own relay set)' : ' (built-in relay)'),
      'address kinds seen: ' + (check.types.join(', ') || 'none'),
      'link state: ' + (pc ? pc.iceConnectionState : 'not started'),
      'page: ' + location.protocol,
    ];
    return lines.join('\n');
  };

  /* ---- six-character room codes ---------------------------------------
     A code this short can't carry the handshake itself, so it can only be a
     name to meet under: both games connect to a public PeerJS signalling
     server, one waits under "DN-K7M2QP" and the other calls it, and the long
     introduction is passed between them over that connection instead of by
     hand. Nothing but the handshake goes through it — the game itself still
     runs browser-to-browser. If the server can't be reached, the paste codes
     below still work with no server at all. */

  const ROOM_LEN = 6;
  const SIGNAL_SERVERS = [
    'wss://0.peerjs.com/peerjs?key=peerjs&version=1.5.4',
    'wss://peerjs.92k.de/peerjs?key=peerjs&version=1.5.4',
  ];
  const HEARTBEAT_MS = 5000;
  const SIGNAL_TIMEOUT_MS = 20000;

  let sig = null, beat = null, roomCode = null;

  N.roomCode = () => roomCode;
  function makeRoomCode() {
    const bytes = new Uint8Array(ROOM_LEN);
    (self.crypto || window.crypto).getRandomValues(bytes);
    return Array.from(bytes, (b) => B32[b & 31]).join('');
  }
  /* people will type these — treat the look-alikes as the same letter */
  N.tidyRoomCode = (code) => String(code || '').toUpperCase()
    .replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V')
    .replace(/[^0-9A-Z]/g, '').slice(0, ROOM_LEN);

  function signalUrls() {
    let extra = null;
    try { extra = localStorage.getItem('dn-signal'); } catch (e) {}
    return extra ? [extra].concat(SIGNAL_SERVERS) : SIGNAL_SERVERS.slice();
  }
  function signalClose() {
    if (beat) { clearInterval(beat); beat = null; }
    if (sig) { try { sig.onclose = null; sig.close(); } catch (e) {} sig = null; }
  }
  /* open a signalling socket under `id`, trying each server in turn */
  function signalOpen(id, onMessage) {
    const urls = signalUrls();
    const token = Math.random().toString(36).slice(2, 10);
    // try every meeting point at once and keep the first that answers, rather
    // than making the player sit through one timeout after another
    return new Promise((resolve, reject) => {
      let settled = false, pending = urls.length, taken = false;
      const sockets = [];
      const finish = (ws) => {
        settled = true;
        sockets.forEach((o) => { if (o !== ws) { try { o.onclose = null; o.close(); } catch (e) {} } });
        sig = ws;
        beat = setInterval(() => { try { ws.send(JSON.stringify({ type: 'HEARTBEAT' })); } catch (er) {} }, HEARTBEAT_MS);
        ws.onerror = null;
        ws.onclose = () => setState(N.state === 'open' ? N.state : 'failed', 'lost the connection to the meeting point');
        resolve(ws);
      };
      const drop = () => {
        if (settled) return;
        if (--pending <= 0) reject(new Error(taken ? 'taken' : 'no-server'));
      };
      urls.forEach((base) => {
        let ws;
        try { ws = new WebSocket(`${base}&id=${encodeURIComponent(id)}&token=${token}`); }
        catch (e) { drop(); return; }
        sockets.push(ws);
        ws.onerror = drop;
        ws.onclose = drop;
        ws.onmessage = (e) => {
          let m;
          try { m = JSON.parse(e.data); } catch (err) { return; }
          if (m.type === 'OPEN') { if (!settled) finish(ws); return; }
          if (m.type === 'ID-TAKEN') { taken = true; try { ws.close(); } catch (er) {} return; }
          if (ws === sig) onMessage(m);
        };
      });
      setTimeout(() => { if (!settled) { settled = true; sockets.forEach((o) => { try { o.onclose = null; o.close(); } catch (e) {} }); reject(new Error('no-server')); } }, SIGNAL_TIMEOUT_MS);
    });
  }
  const signalSend = (dst, payload) => {
    if (sig && sig.readyState === 1) sig.send(JSON.stringify({ type: 'OFFER', dst, payload }));
  };

  /* every candidate found from here on goes straight down the wire, which
     connects far more reliably than one bundled list ever could */
  function trickleTo(dst) {
    pc.onicecandidate = (e) => {
      if (e.candidate) signalSend(dst, { cand: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate });
    };
  }

  N.hostRoom = async function () {
    N.role = 'host';
    freshPeer();
    setState('offering');
    wireChannel(pc.createDataChannel('wordsville', { ordered: false, maxRetransmits: 0 }));
    let peerId = null;
    for (let tries = 0; tries < 4; tries++) {
      const code = makeRoomCode();
      try {
        await signalOpen('DN-' + code, onSignal);
        peerId = code;
        break;
      } catch (e) {
        if (e.message === 'taken') continue;      // astronomically unlikely, but free to handle
        signalClose();
        throw new Error('no-server');
      }
    }
    if (!peerId) throw new Error('no-server');
    roomCode = peerId;
    setState('waiting');
    return peerId;
  };

  N.joinRoom = async function (code) {
    const clean = N.tidyRoomCode(code);
    if (clean.length !== ROOM_LEN) throw new Error(`a room code is ${ROOM_LEN} letters and numbers`);
    N.role = 'guest';
    freshPeer();
    setState('answering');
    pc.ondatachannel = (e) => wireChannel(e.channel);
    const me = 'DNP' + makeRoomCode() + makeRoomCode();
    try { await signalOpen(me, onSignal); } catch (e) { signalClose(); throw new Error('no-server'); }
    roomCode = clean;
    // knock, and let the host make the offer — they are the one holding the
    // data channel, and an offer without one has nothing to connect
    signalSend('DN-' + clean, { hello: 1 });
    setState('waiting');
    return clean;
  };

  async function onSignal(m) {
    if (!m || !m.payload || !pc) return;
    const from = m.src;
    const p = m.payload;
    try {
      if (p.hello && N.role === 'host') {
        trickleTo(from);
        await pc.setLocalDescription(await pc.createOffer());
        signalSend(from, { sdp: { type: 'offer', sdp: pc.localDescription.sdp } });
      } else if (p.sdp && p.sdp.type === 'offer' && N.role === 'guest') {
        trickleTo(from);
        await pc.setRemoteDescription(p.sdp);
        await pc.setLocalDescription(await pc.createAnswer());
        signalSend(from, { sdp: { type: 'answer', sdp: pc.localDescription.sdp } });
      } else if (p.sdp && p.sdp.type === 'answer' && N.role === 'host') {
        await pc.setRemoteDescription(p.sdp);
      } else if (p.cand) {
        await pc.addIceCandidate(p.cand);
      }
    } catch (e) { /* a stray or late message is not worth ending the game over */ }
  }

  /* ---- connection ----------------------------------------------------- */
  function gatherAll() {
    // ICE trickles in; take everything that arrives, but never hang on it
    return new Promise((resolve) => {
      const cands = [];
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(cands); } };
      pc.onicecandidate = (e) => {
        if (!e.candidate) return finish();
        const c = e.candidate.candidate;
        if (c && c.indexOf(' udp ') !== -1) cands.push(c.replace(/^a=/, ''));
      };
      setTimeout(finish, GATHER_MS);
    });
  }
  function wireChannel(c) {
    chan = c;
    chan.onopen = () => { signalClose(); setState('open'); if (N.onOpen) N.onOpen(); };
    chan.onclose = () => { setState('closed'); if (N.onClose) N.onClose(); };
    chan.onmessage = (e) => {
      if (!N.onMessage) return;
      try { N.onMessage(JSON.parse(e.data)); } catch (err) { /* a torn packet is not worth a crash */ }
    };
  }
  function freshPeer() {
    if (!N.available()) throw new Error(N.unavailableReason);
    close();
    pc = new RTCPeerConnection({ iceServers: iceServers() });
    pc.onconnectionstatechange = () => {
      if (!pc) return;
      const st = pc.connectionState;
      if (st === 'connecting' && N.state !== 'open') setState('linking');
      else if (st === 'failed') setState('failed', "your two networks wouldn't let the games reach each other");
      else if (st === 'disconnected' && N.state === 'open') setState('closed');
    };
  }

  /* Host: make an invite code, then wait for the friend's reply code. */
  N.host = async function () {
    N.role = 'host';
    freshPeer();
    setState('offering');
    wireChannel(pc.createDataChannel('wordsville', { ordered: false, maxRetransmits: 0 }));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const cands = await gatherAll();
    setState('waiting');
    return encode('offer', pc.localDescription.sdp, cands);
  };
  N.acceptReply = async function (code) {
    const { kind, sdp, cands } = decode(code);
    if (kind !== 'answer') throw new Error('that looks like an invite code, not a reply code');
    await pc.setRemoteDescription({ type: 'answer', sdp });
    for (const c of cands) { try { await pc.addIceCandidate({ candidate: c, sdpMid: '0', sdpMLineIndex: 0 }); } catch (e) {} }
  };

  /* Guest: take the invite code and hand back a reply code. */
  N.join = async function (code) {
    const { kind, sdp, cands } = decode(code);
    if (kind !== 'offer') throw new Error('that looks like a reply code, not an invite code');
    N.role = 'guest';
    freshPeer();
    setState('answering');
    pc.ondatachannel = (e) => wireChannel(e.channel);
    await pc.setRemoteDescription({ type: 'offer', sdp });
    for (const c of cands) { try { await pc.addIceCandidate({ candidate: c, sdpMid: '0', sdpMLineIndex: 0 }); } catch (e) {} }
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    const mine = await gatherAll();
    setState('waiting');
    return encode('answer', pc.localDescription.sdp, mine);
  };

  N.send = function (obj) {
    if (!chan || chan.readyState !== 'open') return false;
    try { chan.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
  };
  N.isOpen = () => !!(chan && chan.readyState === 'open');
  function close() {
    if (chan) { try { chan.onclose = null; chan.close(); } catch (e) {} chan = null; }
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  }
  N.hangUp = function () {
    signalClose();
    roomCode = null;
    close();
    N.role = null;
    setState('idle');
  };

  return N;
})();

</script>
<script>
/* ============================================================
   Diction & Nina — the Controller
   ------------------------------------------------------------
   This is not the game. It is a controller for the game, on a
   phone, for somebody sitting in front of a screen that is
   running it. There is nothing to look at on a controller, so
   there is nothing to look at here: a code to type in, and then
   a thumb-stick and some buttons.

   It talks to the game the same way two copies of the game talk
   to each other — a room code and a direct connection — because
   it is the same problem: two browsers that have to find each
   other. Which player it is, is decided by the screen and sent
   back, so this end never has to be told anything twice.
   ============================================================ */
(() => {
  const $ = (id) => document.getElementById(id);
  const join = $('pad-join'), face = $('pad-face');
  const msg = $('pad-msg'), box = $('pad-room'), who = $('pad-who');
  const stick = $('pad-stick'), nub = $('pad-nub');
  let sending = null;
  const st = { ax: 0, ay: 0, b: {} };

  const say = (t) => { msg.innerHTML = t; };

  /* ---- the surface ---- */
  let grabbed = null;
  const setNub = (dx, dy) => {
    nub.style.left = (50 + dx * 30) + '%';
    nub.style.top = (50 + dy * 30) + '%';
  };
  const aim = (pt) => {
    const r = stick.getBoundingClientRect();
    const rad = r.width / 2;
    let dx = (pt.clientX - (r.left + rad)) / rad;
    let dy = (pt.clientY - (r.top + r.height / 2)) / rad;
    const d = Math.hypot(dx, dy);
    if (d > 1) { dx /= d; dy /= d; }
    // a dead spot in the middle, or a thumb resting on the glass walks you off
    st.ax = Math.abs(dx) < 0.18 ? 0 : dx;
    st.ay = Math.abs(dy) < 0.18 ? 0 : dy;
    setNub(dx, dy);
  };
  const drop = () => { grabbed = null; st.ax = 0; st.ay = 0; setNub(0, 0); };
  stick.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0]; grabbed = t.identifier; aim(t); e.preventDefault();
  }, { passive: false });
  stick.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) if (t.identifier === grabbed) aim(t);
    e.preventDefault();
  }, { passive: false });
  const letGo = (e) => {
    for (const t of e.changedTouches) if (t.identifier === grabbed) drop();
  };
  stick.addEventListener('touchend', letGo);
  stick.addEventListener('touchcancel', letGo);
  // and a mouse, so it can be tried on anything with a pointer
  stick.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') { grabbed = 'm'; aim(e); } });
  stick.addEventListener('pointermove', (e) => { if (grabbed === 'm') aim(e); });
  window.addEventListener('pointerup', () => { if (grabbed === 'm') drop(); });

  document.querySelectorAll('[data-b]').forEach((btn) => {
    const b = +btn.dataset.b;
    const on = (e) => { e.preventDefault(); st.b[b] = true; if (navigator.vibrate) try { navigator.vibrate(8); } catch (er) {} };
    const off = (e) => { e.preventDefault(); st.b[b] = false; };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointerleave', off);
    btn.addEventListener('pointercancel', off);
  });

  /* ---- the wire ---- */
  /* Which of them this phone is holding. The screen sends the name, because
     the screen is where the choosing happened — a player who swapped to Limey
     is Limey, whichever slot they are sitting in. */
  function drawMe(name, slot) {
    const cv = $('pad-me');
    if (!cv || !window.Crayon) return;
    const kind = /nina/i.test(name) ? 'nina' : /limey/i.test(name) ? 'limey'
      : /diction/i.test(name) ? 'diction' : ['diction', 'nina', 'limey'][slot % 3];
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cv.width, cv.height);
    const k = cv.width / 150;
    c.save(); c.scale(k, k);
    Crayon.who(c, kind, 75, 126, 1, 11 + slot * 7, slot % 2 ? 0.03 : -0.04);
    c.restore();
  }

  function live(slot, name, quiet) {
    join.classList.add('hidden');
    face.classList.remove('hidden');
    who.textContent = `Player ${slot + 1} — ${name}`;
    drawMe(name, slot);
    if (sending) clearInterval(sending);
    if (quiet) return;          // shown without a wire behind it, for a test
    /* Twenty times a second: often enough to walk with, seldom enough that a
       phone on a slow connection keeps up with it. */
    sending = setInterval(() => {
      if (Net.state !== 'open') { stop('Disconnected.'); return; }
      Net.send({ t: 'pad', ax: st.ax, ay: st.ay, b: st.b });
    }, 50);
  }
  function stop(why) {
    if (sending) { clearInterval(sending); sending = null; }
    face.classList.add('hidden');
    join.classList.remove('hidden');
    say('<b>' + (why || 'Disconnected.') + '</b>');
    try { Net.close(); } catch (e) {}
  }

  Net.onMessage = (m) => {
    if (m && m.t === 'padok') live(m.slot | 0, m.name || 'a player');
  };
  Net.onClose = () => stop('The game closed the connection.');

  async function go() {
    const code = Net.tidyRoomCode(box.value);
    if (code.length < 6) { say('<b>That code looks too short.</b>'); return; }
    if (!Net.available()) { say('<b>' + Net.unavailableReason + '</b>'); return; }
    say('Connecting…');
    try {
      await Net.joinRoom(code);
      Net.send({ t: 'padhello' });
      say('Connected — asking which player you are…');
    } catch (e) {
      say('<b>' + (e && e.message === 'no-room'
        ? "No game is showing that code. Check it, and that their game is still waiting."
        : "Couldn't connect. Check the code and try again.") + '</b>');
    }
  }
  $('pad-go').onclick = go;
  box.addEventListener('input', () => { box.value = Net.tidyRoomCode(box.value); });
  box.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('pad-off').onclick = () => stop('Disconnected.');

  // for tests: the same surface, driven without a real connection
  window.PAD = { state: () => ({ ax: st.ax, ay: st.ay, b: Object.assign({}, st.b) }),
    live, stop, connected: () => !face.classList.contains('hidden'),
    // the surface with no wire behind it, so it can be looked at and pressed
    show: (slot, name) => live(slot || 0, name || 'a player', true) };
})();

</script>
