<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — VertexLab Solutions</title>
<meta name="robots" content="noindex">
<style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#2E7D32;--blue:#3b82f6;--orange:#f97316;--teal:#0D9488;--dark:#0f172a;--light:#f8fafc;--white:#fff;--gray:#64748b;--border:#e2e8f0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;color:var(--dark);background:var(--light)}
        a{color:inherit;text-decoration:none}
        
        /* Nav */
        nav{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
        .nav-brand{font-size:20px;font-weight:800;color:var(--dark)}
        .nav-brand span{color:var(--primary)}
        .nav-links{display:flex;gap:28px;align-items:center}
        .nav-links a{font-size:14px;font-weight:500;color:var(--gray);transition:color .2s}
        .nav-links a:hover{color:var(--dark)}
        
        /* Hero */
        .hero{background:linear-gradient(135deg,var(--dark) 0%,#1e293b 100%);color:var(--white);padding:80px 24px;text-align:center}
        .hero h1{font-size:clamp(32px,5vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px}
        .hero h1 span{background:linear-gradient(135deg,#4ade80,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .hero p{font-size:18px;color:rgba(255,255,255,.6);max-width:600px;margin:0 auto 32px}
        .hero-stats{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
        .hero-stat{text-align:center}
        .hero-stat .num{font-size:28px;font-weight:800;color:#4ade80}
        .hero-stat .lbl{font-size:12px;color:rgba(255,255,255,.4)}
        
        /* Section */
        .section{max-width:1200px;margin:0 auto;padding:60px 24px}
        .section-header{text-align:center;margin-bottom:40px}
        .section-header .badge{display:inline-block;padding:4px 14px;background:var(--primary);color:var(--white);font-size:12px;font-weight:700;border-radius:20px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
        .section-header .badge.blue{background:var(--blue)}
        .section-header h2{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
        .section-header p{color:var(--gray);font-size:16px;max-width:500px;margin:0 auto}
        
        /* App Grid */
        .app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
        .app-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;transition:transform .2s,box-shadow .2s}
        .app-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
        .app-card .top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
        .app-card .emoji{font-size:36px}
        .app-card .info h3{font-size:16px;font-weight:700}
        .app-card .info .status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:2px}
        .status-live{background:#dcfce7;color:#16a34a}
        .status-review{background:#fef3c7;color:#d97706}
        .status-ready{background:#dbeafe;color:#2563eb}
        .status-building{background:#f3e8ff;color:#7c3aed}
        .app-card .desc{font-size:13px;color:var(--gray);margin-bottom:14px;line-height:1.5}
        .app-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
        .app-card .tag{font-size:11px;padding:3px 8px;background:var(--light);border-radius:6px;color:var(--gray)}
        .app-card .store-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--dark);color:var(--white);border-radius:8px;font-size:12px;font-weight:600;transition:background .2s}
        .app-card .store-btn:hover{background:#334155}
        .app-card .store-btn.disabled{background:var(--border);color:var(--gray);cursor:default}
        /* Some of these run in a browser as well as on the App Store, so the
           card offers both and the web one is the quieter of the two. */
        .app-card .btn-row{display:flex;gap:8px;flex-wrap:wrap}
        .app-card .store-btn.web{background:var(--white);color:var(--dark);border:1px solid var(--border)}
        .app-card .store-btn.web:hover{background:var(--light)}
        
        /* B2B Grid */
        .b2b-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px}
        .b2b-card{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:28px;transition:transform .2s,box-shadow .2s}
.nf{max-width:640px;margin:0 auto;padding:96px 24px;text-align:center}
.nf h1{font-size:40px;margin:0 0 12px}
.nf p{font-size:17px;line-height:1.6;opacity:.85;margin:0 0 28px}
.nf a{display:inline-block;margin:6px 8px;padding:12px 20px;border-radius:10px;
      background:#175E54;color:#fff;text-decoration:none;font-weight:600}
.nf a.alt{background:transparent;border:1px solid rgba(128,128,128,.4);color:inherit}
</style>
</head>
<body>
<div class="nf">
  <h1>Page not found</h1>
  <p>That page doesn't exist. It may have moved, or the link may have a typo in it.</p>
  <a href="/">VertexLab Solutions</a>
  <a class="alt" href="/settle/guides/">Executor guides</a>
  <a class="alt" href="/support">Support</a>
</div>
</body>
</html>
